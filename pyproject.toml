[project]
name = "notion-command-center"
version = "0.1.0"
requires-python = ">=3.11"
description = "Declarative setup and local integrations for a private Notion command center"

[project.scripts]
command-center = "command_center.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

