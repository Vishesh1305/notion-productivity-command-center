<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Productivity Command Center</title>
  <desc id="desc">A dark, calm dashboard illustration with a daily plan, calendar, and project progress.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1225"/>
      <stop offset="0.53" stop-color="#111B35"/>
      <stop offset="1" stop-color="#102D37"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76E4DC"/>
      <stop offset="1" stop-color="#A8A9FF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D3152"/>
      <stop offset="1" stop-color="#15243E"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#010612" flood-opacity="0.4"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#A6C6D5" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="28" fill="url(#grid)"/>
  <circle cx="1120" cy="15" r="250" fill="#2D94A1" opacity="0.09"/>
  <circle cx="550" cy="510" r="270" fill="#8A80F6" opacity="0.075"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="66" y="62" width="190" height="30" rx="15" fill="#203A4A" stroke="#68D7CC" stroke-opacity="0.4"/>
    <circle cx="84" cy="77" r="5" fill="#69E2D4"/>
    <text x="99" y="82" font-size="12" font-weight="700" letter-spacing="2.2" fill="#A1E6DE">PERSONAL SYSTEM</text>

    <text x="64" y="173" font-size="60" font-weight="750" letter-spacing="-2.6" fill="#F3F7FF">Productivity</text>
    <text x="64" y="241" font-size="60" font-weight="750" letter-spacing="-2.6" fill="url(#accent)">Command Center</text>
    <text x="67" y="285" font-size="18" fill="#B8C7DC">A focused Notion dashboard, backed by thoughtful automation.</text>
    <text x="67" y="314" font-size="18" fill="#B8C7DC">Plan the day. Protect the real deadlines. Keep the context.</text>

    <rect x="67" y="374" width="110" height="34" rx="17" fill="#223C4A"/>
    <text x="88" y="396" font-size="13" font-weight="650" fill="#A7EEE2">NOTION</text>
    <rect x="187" y="374" width="136" height="34" rx="17" fill="#2D3155"/>
    <text x="206" y="396" font-size="13" font-weight="650" fill="#D1CAFF">APPLE CALENDAR</text>
    <rect x="334" y="374" width="104" height="34" rx="17" fill="#243653"/>
    <text x="356" y="396" font-size="13" font-weight="650" fill="#B9D7FF">PYTHON</text>

    <g filter="url(#shadow)">
      <rect x="677" y="59" width="455" height="363" rx="23" fill="url(#card)" stroke="#6B83AD" stroke-opacity="0.33"/>
      <rect x="677" y="59" width="455" height="55" rx="23" fill="#203753"/>
      <path d="M677 93H1132V114H677Z" fill="#203753"/>
      <circle cx="704" cy="87" r="5" fill="#76E4DC"/>
      <circle cx="724" cy="87" r="5" fill="#A8A9FF"/>
      <circle cx="744" cy="87" r="5" fill="#F2C783"/>
      <text x="769" y="94" font-size="12" font-weight="700" letter-spacing="1.6" fill="#C1D5E9">HOME / TODAY</text>

      <text x="706" y="151" font-size="13" font-weight="700" letter-spacing="1.8" fill="#82DFD7">DAILY TOP 3</text>
      <rect x="705" y="167" width="272" height="39" rx="10" fill="#2A4260"/>
      <circle cx="724" cy="186" r="7" fill="none" stroke="#83E2D9" stroke-width="2"/>
      <rect x="746" y="182" width="145" height="7" rx="3.5" fill="#E0EDFB"/>
      <rect x="705" y="213" width="272" height="39" rx="10" fill="#263B58"/>
      <circle cx="724" cy="232" r="7" fill="none" stroke="#AFAEF9" stroke-width="2"/>
      <rect x="746" y="228" width="175" height="7" rx="3.5" fill="#C4D4E8"/>
      <rect x="705" y="259" width="272" height="39" rx="10" fill="#263B58"/>
      <circle cx="724" cy="278" r="7" fill="none" stroke="#AFAEF9" stroke-width="2"/>
      <rect x="746" y="274" width="125" height="7" rx="3.5" fill="#C4D4E8"/>

      <rect x="994" y="136" width="110" height="162" rx="14" fill="#173B4B" stroke="#4A8F95" stroke-opacity="0.48"/>
      <text x="1009" y="162" font-size="11" font-weight="700" letter-spacing="1.1" fill="#90E2D7">CALENDAR</text>
      <text x="1009" y="194" font-size="28" font-weight="750" fill="#F4FAFF">02</text>
      <text x="1009" y="215" font-size="11" fill="#B5D7DF">upcoming</text>
      <rect x="1009" y="240" width="78" height="6" rx="3" fill="#52CABC"/>
      <rect x="1009" y="254" width="51" height="6" rx="3" fill="#639CA6"/>

      <text x="706" y="343" font-size="13" font-weight="700" letter-spacing="1.8" fill="#B8B4FF">WEEKLY PROGRESS</text>
      <rect x="706" y="360" width="398" height="11" rx="5.5" fill="#34506A"/>
      <rect x="706" y="360" width="261" height="11" rx="5.5" fill="url(#accent)"/>
      <text x="706" y="392" font-size="11" fill="#ABC1D7">One clear view of what matters next</text>
      <text x="1059" y="392" font-size="11" font-weight="700" fill="#C9F1EA">65%</text>
    </g>
  </g>
</svg>
